      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: grep -E "^e: |What went wrong|Execution failed|error:" -A2 build.log | head -60
